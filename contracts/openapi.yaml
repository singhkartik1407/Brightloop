        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 2000 }
        productId: { $ref: '#/components/schemas/UUID' }
        price: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        billingInterval: { $ref: '#/components/schemas/BillingInterval' }
        intervalCount: { type: integer, minimum: 1, default: 1 }
        minQuantity: { type: integer, minimum: 1 }
        availableFrom: { type: [string, "null"], format: date }
        availableUntil: { type: [string, "null"], format: date }
        autoCloseAtEnd: { type: boolean, default: false }
        allowEarlyClose: { type: boolean, default: false }
        allowPause: { type: boolean, default: false }
        allowRenewal: { type: boolean, default: true }
    PlanUpdate:
