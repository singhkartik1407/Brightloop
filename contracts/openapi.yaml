      operationId: receivePaymentWebhook
      summary: Receive payment gateway webhook
      description: Public provider endpoint; implementation must verify provider signature and deduplicate event IDs. Never trust client-submitted payment success.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, example: configured-provider }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: Webhook accepted for processing. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSummary
      summary: Get finance dashboard summary
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: currency
          in: query
          schema: { type: string, minLength: 3, maxLength: 3, example: INR }
      responses:
        '200':
          description: Dashboard summary. Monetary fields are decimal strings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
              example:
                activeSubscriptions: 128
                revenueReceived: '125000.00'
                outstandingAmount: '18500.00'
                overdueInvoiceCount: 7
                mrr: '95000.00'
                arr: '1140000.00'
                totalInvoices: 342
                upcomingRenewals: 18
                currency: INR
                asOf: '2026-10-31T04:00:00Z'
  /api/v1/analytics/revenue:
    get:
      tags: [Analytics]
      operationId: getRevenueSeries
      summary: Get revenue time series
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: groupBy
          in: query
          schema: { type: string, enum: [DAY, WEEK, MONTH], default: MONTH }
      responses:
        '200':
          description: Revenue series.
          content:
            application/json:
              schema:
                type: object
                required: [currency, points]
                properties:
                  currency: { type: string, example: INR }
                  points:
                    type: array
                    items: { $ref: '#/components/schemas/RevenuePoint' }
  /api/v1/analytics/renewals:
    get:
      tags: [Analytics]
      operationId: getUpcomingRenewals
      summary: List upcoming subscription renewals
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Upcoming renewals.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RenewalItem' }
  /api/v1/analytics/overdue:
    get:
      tags: [Analytics]
      operationId: getOverdueInvoices
      summary: List overdue invoices
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Overdue invoices.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OverdueInvoiceItem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaxRuleId:
      name: taxRuleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DiscountRuleId:
      name: discountRuleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuotationId:
      name: quotationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key to safely retry a create/payment request.
      schema: { type: string, minLength: 8, maxLength: 100 }
  responses:
    BadRequest:
      description: Request could not be processed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated user does not have permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Requested record was not found or is not visible to caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Request conflicts with current resource state or uniqueness rules.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: One or more input fields are invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    UUID:
      type: string
      format: uuid
    Money:
      type: string
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      description: Decimal string. Never send a JSON floating-point number for money.
      examples: ['560.00', '1056.00']
    Currency:
      type: string
      minLength: 3
      maxLength: 3
      description: ISO 4217 currency code; configurable business default.
      example: INR
    Password:
      type: string
      minLength: 9
      maxLength: 128
      description: Must contain uppercase, lowercase and special character (brief requires more than 8 characters).
      format: password
    Role:
      type: string
      enum: [ADMIN, STAFF, CUSTOMER]
    User:
      type: object
      required: [id, email, fullName, role, isActive, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        customerId: { $ref: '#/components/schemas/UUID' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        businessName: { type: string, maxLength: 160 }
        phone: { type: string, maxLength: 30 }
    StaffCreateRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        phone: { type: string, maxLength: 30 }
        isActive: { type: boolean, default: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, format: password }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Access token lifetime in seconds. }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        customer: { $ref: '#/components/schemas/Customer' }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: One or more fields are invalid. }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        requestId: { type: string }
    PaginatedResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: {} }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    Address:
      type: object
      properties:
        line1: { type: string, maxLength: 160 }
        line2: { type: string, maxLength: 160 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        stateCode: { type: string, maxLength: 10, description: State code used by configured GST place-of-supply logic where applicable. }
        postalCode: { type: string, maxLength: 20 }
        countryCode: { type: string, minLength: 2, maxLength: 2, example: IN }
    Customer:
      type: object
      required:
        - id
        - user_id
        - display_name
        - company_name
        - billing_email
        - phone
        - tax_identifier
        - billing_address_line1
        - billing_address_line2
        - billing_city
        - billing_state
        - billing_postal_code
        - billing_country_code
        - notes
        - is_active
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        user_id:
          anyOf:
            - { $ref: '#/components/schemas/UUID' }
            - { type: "null" }
        display_name: { type: string, maxLength: 200 }
        company_name: { type: [string, "null"], maxLength: 200 }
        billing_email: { type: string, format: email, maxLength: 320 }
        phone: { type: [string, "null"], maxLength: 30 }
        tax_identifier: { type: [string, "null"], maxLength: 50 }
        billing_address_line1: { type: [string, "null"], maxLength: 255 }
        billing_address_line2: { type: [string, "null"], maxLength: 255 }
        billing_city: { type: [string, "null"], maxLength: 100 }
        billing_state: { type: [string, "null"], maxLength: 100 }
        billing_postal_code: { type: [string, "null"], maxLength: 20 }
        billing_country_code: { type: [string, "null"], minLength: 2, maxLength: 2 }
        notes: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomerProfileRead:
