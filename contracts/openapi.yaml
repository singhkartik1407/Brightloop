        availableUntil: { type: [string, "null"], format: date }
        autoCloseAtEnd: { type: boolean }
        allowEarlyClose: { type: boolean }
        allowPause: { type: boolean }
        allowRenewal: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    PlanCreate:
      type: object
