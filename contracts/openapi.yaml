    TaxRule:
      type: object
      required: [id, name, code, taxType, ratePercent, isActive, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        code: { type: string }
        taxType: { $ref: '#/components/schemas/TaxType' }
        ratePercent: { type: string, pattern: '^\d{1,3}(\.\d{1,4})?$' }
        jurisdiction: { type: [string, "null"], description: Configurable jurisdiction/state applicability. }
        isInclusive: { type: boolean, default: false }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    TaxRuleCreate:
      type: object
      required: [name, code, taxType, ratePercent]
