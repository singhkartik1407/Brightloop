        name: { type: string }
        code: { type: [string, "null"] }
        discountType: { $ref: '#/components/schemas/DiscountType' }
        value: { $ref: '#/components/schemas/Money', description: Fixed discount amount or percentage numeric value represented as decimal string. }
        scope: { $ref: '#/components/schemas/DiscountScope' }
        productIds: { type: array, items: { $ref: '#/components/schemas/UUID' } }
        minimumPurchase: { type: [string, "null"], description: Decimal string or null. }
        minimumQuantity: { type: [integer, "null"], minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        maxUses: { type: [integer, "null"], minimum: 1 }
        usedCount: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    DiscountRuleCreate:
      type: object
      required: [name, discountType, value, scope, startsAt, endsAt]
      properties:
        name: { type: string, maxLength: 160 }
        code: { type: [string, "null"], maxLength: 50 }
        discountType: { $ref: '#/components/schemas/DiscountType' }
        value: { type: string, pattern: '^\d{1,14}(\.\d{1,4})?$' }
