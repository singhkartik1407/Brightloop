        company_name: { type: [string, "null"] }
        billing_email: { type: string, format: email }
        phone: { type: [string, "null"] }
        tax_identifier: { type: [string, "null"] }
        billing_address_line1: { type: [string, "null"] }
        billing_address_line2: { type: [string, "null"] }
        billing_city: { type: [string, "null"] }
        billing_state: { type: [string, "null"] }
        billing_postal_code: { type: [string, "null"] }
        billing_country_code: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomerCreateRequest:
      type: object
