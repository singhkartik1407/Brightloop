    CustomerSelfUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        company_name: { type: [string, "null"], maxLength: 200 }
        billing_email: { type: string, format: email }
        phone: { type: [string, "null"], maxLength: 30 }
        tax_identifier: { type: [string, "null"], maxLength: 50 }
        billing_address_line1: { type: [string, "null"], maxLength: 255 }
        billing_address_line2: { type: [string, "null"], maxLength: 255 }
        billing_city: { type: [string, "null"], maxLength: 100 }
        billing_state: { type: [string, "null"], maxLength: 100 }
        billing_postal_code: { type: [string, "null"], maxLength: 20 }
        billing_country_code: { type: [string, "null"], minLength: 2, maxLength: 2 }

    ProductType:
      type: string
      enum: [SOFTWARE, SERVICE, PHYSICAL, OTHER]
    ProductVariant:
      type: object
      required: [id, attributeName, attributeValue, priceAdjustment, isActive]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        attributeName: { type: string, example: Brand }
        attributeValue: { type: string, example: Odoo }
        priceAdjustment: { $ref: '#/components/schemas/Money' }
        isActive: { type: boolean }
    ProductVariantInput:
      type: object
      additionalProperties: false
      required: [attributeName, attributeValue, priceAdjustment]
      properties:
        attributeName: { type: string, minLength: 1, maxLength: 80 }
        attributeValue: { type: string, minLength: 1, maxLength: 120 }
        priceAdjustment: { $ref: '#/components/schemas/Money', minimum: 0 }
    Product:
      type: object
      required: [id, name, type, salesPrice, currency, variants, isActive, createdAt]
      properties:
