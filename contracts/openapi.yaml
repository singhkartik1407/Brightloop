openapi: 3.1.0
info:
  title: Brightloop Subscription Management API
  version: 0.1.0
  summary: Draft contract for parallel frontend and backend development.
  description: |
    Initial contract for Brightloop Software's subscription management platform.

    This is a **team draft**, not a claim that every endpoint is already implemented.
    Developer A (backend) maintains this file; Developer B (frontend) reviews it and
    builds against it. Any breaking field/route/enum change must be agreed by both.

    Conventions:
    - API prefix: /api/v1. Health is /health.
    - IDs are UUIDs.
    - Timestamps are ISO 8601 UTC strings.
    - Money is represented as decimal strings plus a currency code (never JSON float).
    - List responses use items/total/page/pageSize.
    - Errors use ErrorResponse.
    - Roles: ADMIN, STAFF, CUSTOMER.

    Draft assumptions to confirm before final billing implementation:
    - Plan price is treated as a recurring base fee; subscription product lines are additional recurring charges.
    - Upgrade charges the full price difference immediately (no time proration in MVP).
    - Downgrade takes effect at next renewal, with no immediate refund.
    - INR and Asia/Kolkata are proposed configurable defaults, not hardcoded policy.
    - Gateway provider and production GST configuration remain to be selected/configured.
  contact:
    name: Brightloop project team
servers:
  - url: http://localhost:8000
    description: Local FastAPI development server
  - url: https://{host}
    description: Configurable deployed API host
    variables:
      host:
        default: api.example.com
tags:
  - name: Health
  - name: Auth
  - name: Customers
  - name: Products
  - name: Plans
  - name: Taxes
  - name: Discounts
  - name: Quote Templates
  - name: Quotations
  - name: Subscriptions
  - name: Invoices
  - name: Payments
  - name: Analytics
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Check API health
      security: []
      responses:
        '200':
          description: API process is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
                  timestamp: { type: string, format: date-time }
              example: { status: ok, timestamp: '2026-10-31T04:00:00Z' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Register a customer account
      description: Public self-registration creates a CUSTOMER account and associated customer profile. Staff accounts cannot be self-registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              fullName: Asha Rao
              email: asha@example.com
              password: Strong!Pass123
              businessName: Rao Retail
              phone: '+919876543210'
      responses:
        '201':
          description: Customer account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: asha@example.com, password: Strong!Pass123 }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Refresh access token using refresh token cookie
      description: The implementation should issue the refresh token in a secure HttpOnly cookie. Frontend must use credentialed requests where configured.
      security: []
      responses:
        '200':
          description: New access token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout and clear refresh session
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session ended; refresh cookie cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the authenticated user and role
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Request accepted. Response should not reveal whether an email exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 20 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200':
          description: Password reset completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/staff:
    get:
      tags: [Auth]
      operationId: listStaffMembers
      summary: List internal staff members (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated staff members.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Auth]
      operationId: createStaffMember
      summary: Create an internal staff account (admin only)
      description: Only an ADMIN may create STAFF accounts. Public registration cannot create staff users.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreateRequest' }
      responses:
        '201':
          description: Staff account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }


  /api/v1/customers/me:
    get:
      tags: [Customer Management, Customer Portal]
      operationId: getMyCustomerProfile
      summary: Get the authenticated customer's own profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Customer profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfileRead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customer Management, Customer Portal]
      operationId: updateMyCustomerProfile
      summary: Update the authenticated customer's own profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSelfUpdateRequest' }
      responses:
        '200':
          description: Updated customer profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfileRead' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers:
    get:
      tags: [Customer Management]
      operationId: listCustomers
      summary: List, search and paginate customers
      description: Admin and Staff only.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Paginated customers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

    post:
      tags: [Customer Management]
      operationId: createCustomer
      summary: Create a customer profile
      description: Admin and Staff only. New profiles are not automatically linked to login accounts.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreateRequest' }
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{customer_id}:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UUID' }

    get:
      tags: [Customer Management]
      operationId: getCustomer
      summary: Get customer details
      description: Admin and Staff only. Archived profiles can also be retrieved by ID.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Customer details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

    patch:
      tags: [Customer Management]
      operationId: updateCustomer
      summary: Update a customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdateRequest' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

    delete:
      tags: [Customer Management]
      operationId: archiveCustomer
      summary: Soft archive a customer
      description: Sets is_active to false. The database record is retained.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Customer archived. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/customers/{customer_id}/restore:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    post:
      tags: [Customer Management]
      operationId: restoreCustomer
      summary: Restore an archived customer
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Customer restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create product with optional variant options
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
            example:
              name: Business Suite
              type: SOFTWARE
              salesPrice: '1000.00'
              costPrice: '450.00'
              currency: INR
              notes: Core subscription product
              variants:
                - attributeName: Brand
                  attributeValue: Odoo
                  priceAdjustment: '560.00'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403':
          description: Only Admin may create products. Staff cannot create products because costPrice is required and Admin-only.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get product and variant options
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Update product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: No fields were provided for update.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { type: string }
        '409': { description: Archived product cannot be updated. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/products/{productId}/archive:
    post:
      tags: [Products]
      operationId: archiveProduct
      summary: Archive product instead of deleting historical references
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204': { description: Product archived. }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: List subscription plans
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: billingInterval
          in: query
          schema: { $ref: '#/components/schemas/BillingInterval' }
      responses:
        '200':
          description: Paginated plans.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create a plan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCreate' }
      responses:
        '201':
          description: Plan created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Associated product not found. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Get plan
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Plan detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Plans]
      operationId: updatePlan
      summary: Update plan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanUpdate' }
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Conflicting plan name or archived plan must be restored. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/plans/{planId}/archive:
    post:
      tags: [Plans]
      operationId: archivePlan
      summary: Archive plan
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '204': { description: Plan archived. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/plans/{planId}/restore:
    post:
      tags: [Plans]
      operationId: restorePlan
      summary: Restore an archived plan
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Plan restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Restoring plan conflicts with an active plan name. }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/tax-rules:
    get:
      tags: [Taxes]
      operationId: listTaxRules
      summary: List configurable tax rules
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: taxType
          in: query
          schema: { $ref: '#/components/schemas/TaxType' }
        - name: jurisdiction
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated tax rules.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TaxRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Taxes]
      operationId: createTaxRule
      summary: Create tax rule
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxRuleCreate' }
      responses:
        '201':
          description: Tax rule created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tax-rules/{taxRuleId}:
    parameters:
      - $ref: '#/components/parameters/TaxRuleId'
    get:
      tags: [Taxes]
      operationId: getTaxRule
      summary: Get tax rule detail
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tax rule detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Taxes]
      operationId: updateTaxRule
      summary: Update tax rule
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxRuleUpdate' }
      responses:
        '200':
          description: Updated tax rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tax-rules/{taxRuleId}/archive:
    post:
      tags: [Taxes]
      operationId: archiveTaxRule
      summary: Archive tax rule
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaxRuleId'
      responses:
        '204': { description: Tax rule archived. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
